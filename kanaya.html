<style>
  :root {
    --bg: #f6f5f2; --bg-table: #fff; --bg-row-alt: #f9f8f6; --bg-header: #e8e6e1;
    --text: #2a2824; --text-dim: #7a7670; --text-mono: #3a3632;
    --border: #ddd9d2; --border-light: #eae7e1; --accent: #2e7d6f;
    --pill-approved-bg: #2f8a3e; --pill-approved-fg: #ffffff;

    --pill-pinned-bg: #fce8c8; --pill-pinned-fg: #8a5e10;
    --unresolved-bg: #f8dad8; --unresolved-fg: #a03028;
    --report-fg: #1a5c4e; --report-no: #b0aca4;
    --link: #2e7d6f; --shadow: rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181e; --bg-table: #1e2028; --bg-row-alt: #22242c; --bg-header: #282a34;
      --text: #d8d5ce; --text-dim: #8a8680; --text-mono: #c0bbb4;

      --pill-open-bg: #1a3a32; --pill-open-fg: #6dd4b8;
      --pill-merged-bg: #2e2840; --pill-merged-fg: #b8a0e0;
      --pill-pinned-bg: #3a2e18; --pill-pinned-fg: #e8c060;
      --unresolved-bg: #3a2020; --unresolved-fg: #e87870;
      --report-fg: #6dd4b8; --report-no: #55524c;
      --link: #4db8a4; --shadow: rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181e; --bg-table: #1e2028; --bg-row-alt: #22242c; --bg-header: #282a34;

    --pill-open-bg: #1a3a32; --pill-open-fg: #6dd4b8;
    --pill-merged-bg: #2e2840; --pill-merged-fg: #b8a0e0;
    --pill-pinned-bg: #3a2e18; --pill-pinned-fg: #e8c060;
    --unresolved-bg: #3a2020; --unresolved-fg: #e87870;
    --report-fg: #6dd4b8; --report-no: #55524c;
    --link: #4db8a4; --shadow: rgba(0,0,0,0.25);
  }
  :root[data-theme="light"] {
    --bg: #f6f5f2; --bg-table: #fff; --bg-row-alt: #f9f8f6; --bg-header: #e8e6e1;
    --text: #2a2824; --text-dim: #7a7670; --text-mono: #3a3632;
    --border: #ddd9d2; --border-light: #eae7e1; --accent: #2e7d6f;
    --pill-approved-bg: #2f8a3e; --pill-approved-fg: #ffffff;
    --pill-changes-bg: #fce8c8; --pill-changes-fg: #8a5e10;
    --pill-draft-bg: #dde3f0; --pill-draft-fg: #3b4e78;
    --pill-open-bg: #d6efe9; --pill-open-fg: #1a5c4e;
    --pill-merged-bg: #e2daf0; --pill-merged-fg: #5a3d8a;
    --pill-pinned-bg: #fce8c8; --pill-pinned-fg: #8a5e10;
    --unresolved-bg: #f8dad8; --unresolved-fg: #a03028;
    --report-fg: #1a5c4e; --report-no: #b0aca4;
    --link: #2e7d6f; --shadow: rgba(0,0,0,0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .page { max-width: 1600px; margin: 0 auto; padding: 24px 20px; }
  .page-header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .page-header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .page-header .meta { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .subtitle { font-size: 12px; color: var(--text-dim); margin-bottom: 18px; }
  .stats { display: flex; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .stat-val { font-weight: 700; font-size: 16px; color: var(--text); font-variant-numeric: tabular-nums; }
  .stat-val.warn { color: var(--unresolved-fg); }
  .scroll-wrap { overflow: auto; max-height: 75vh; border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 1px 3px var(--shadow); background: var(--bg-table); }
  table { width: 100%; min-width: 1500px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  thead th { position: sticky; top: 0; z-index: 2; background: var(--bg-header); text-align: left; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); padding: 10px 9px; border-bottom: 2px solid var(--border); white-space: nowrap; }
  thead th:first-child { padding-left: 14px; }
  tbody tr { border-bottom: 1px solid var(--border-light); }
  tbody tr:nth-child(even) { background: var(--bg-row-alt); }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, var(--bg-table)); }
  td { padding: 8px 9px; vertical-align: middle; font-size: 12.5px; white-space: nowrap; }
  td:first-child { padding-left: 14px; }
  .ticket { font-family: "SF Mono", "Fira Code", ui-monospace, monospace; font-size: 11.5px; font-weight: 600; color: var(--text-mono); }
  .dev { font-size: 11.5px; font-weight: 500; }
  .dev-bien { color: var(--accent); }
  a { color: var(--link); text-decoration: none; font-family: "SF Mono", "Fira Code", ui-monospace, monospace; font-size: 11px; }
  a:hover { text-decoration: underline; }
  a.ticket { color: var(--link); }
  .pill { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 10px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; line-height: 1.5; }
  .pill-approved { background: var(--pill-approved-bg); color: var(--pill-approved-fg); }
  .pill-changes { background: var(--pill-changes-bg); color: var(--pill-changes-fg); }
  .pill-draft { background: var(--pill-draft-bg); color: var(--pill-draft-fg); }
  .pill-open { background: var(--pill-open-bg); color: var(--pill-open-fg); }
  .pill-merged { background: var(--pill-merged-bg); color: var(--pill-merged-fg); }
  .pill-pinned { background: var(--pill-pinned-bg); color: var(--pill-pinned-fg); }
  .pill-todo { background: var(--unresolved-bg); color: var(--unresolved-fg); }
  .jp-cell { font-size: 12px; white-space: normal; }
  .note-cell { max-width: 360px; white-space: normal; font-size: 11px; color: var(--text-dim); line-height: 1.5; }
  .pic-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .pic-chip { display: flex; align-items: center; gap: 7px; padding: 5px 11px; border: 1px solid var(--border); border-radius: 20px; background: var(--bg-table); font-size: 12px; box-shadow: 0 1px 2px var(--shadow); }
  .pic-chip b { font-weight: 600; }
  .pic-chip .frac { font-variant-numeric: tabular-nums; color: var(--text-dim); font-size: 11.5px; }
  .pic-chip .frac.full { color: var(--report-fg); font-weight: 700; }
  .copilot-cell { font-family: "SF Mono", "Fira Code", ui-monospace, monospace; font-size: 11px; }
  .unresolved { display: inline-block; padding: 1px 5px; border-radius: 3px; background: var(--unresolved-bg); color: var(--unresolved-fg); font-weight: 700; font-size: 10.5px; }
  .kanaya-cell { max-width: 230px; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; }
  .rvw-cell { max-width: 210px; white-space: normal; font-size: 11px; line-height: 1.7; }
  .rv-ap { color: var(--report-fg); font-weight: 600; white-space: nowrap; margin-right: 5px; }
  .rv-ch { color: var(--unresolved-fg); font-weight: 600; white-space: nowrap; margin-right: 5px; }
  .rv-pd { color: var(--text-dim); white-space: nowrap; margin-right: 5px; }
  .yeucau-cell { font-size: 11.5px; }
  .yeucau-son { color: var(--pill-merged-fg); font-weight: 600; }
  .report-yes { color: var(--report-fg); font-weight: 700; }
  .report-no { color: var(--report-no); }
  .title-cell { max-width: 300px; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; }
  .date-cell { font-family: "SF Mono", "Fira Code", ui-monospace, monospace; font-size: 11px; color: var(--text-dim); }
  .footnote { margin-top: 14px; font-size: 11px; color: var(--text-dim); line-height: 1.6; }
  .conflict-cell { font-family: "SF Mono","Fira Code",ui-monospace,monospace; font-size: 10.5px; white-space: nowrap; }
  .cf-bad { color: var(--unresolved-fg); font-weight: 700; }
  .cf-ok { color: var(--report-fg); }
  .cf-na { color: var(--report-no); }
  .cf-unk { color: var(--pill-changes-fg); font-weight: 700; }
  .badge-common { display: inline-block; padding: 1px 5px; border-radius: 3px; background: var(--pill-draft-bg); color: var(--pill-draft-fg); font-size: 9px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; vertical-align: middle; }
  .badge-invalid { display: inline-block; padding: 1px 5px; border-radius: 3px; background: var(--unresolved-bg); color: var(--unresolved-fg); font-size: 9px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; vertical-align: middle; }
  .commits { display: inline-block; padding: 0 4px; border-radius: 3px; background: var(--border-light); color: var(--text-dim); font-family: "SF Mono","Fira Code",ui-monospace,monospace; font-size: 10px; font-weight: 600; vertical-align: middle; }
  .files { display: inline-block; padding: 0 4px; border-radius: 3px; background: var(--pill-draft-bg); color: var(--pill-draft-fg); font-family: "SF Mono","Fira Code",ui-monospace,monospace; font-size: 10px; font-weight: 600; vertical-align: middle; }
  .adds { color: var(--report-fg); font-family: "SF Mono","Fira Code",ui-monospace,monospace; font-size: 10px; font-weight: 700; }
  .dels { color: var(--unresolved-fg); font-family: "SF Mono","Fira Code",ui-monospace,monospace; font-size: 10px; font-weight: 700; margin-left: 3px; }
  .topnav { background: var(--bg-header); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .topnav-inner { max-width: 1600px; margin: 0 auto; padding: 9px 20px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .topnav-brand { font-weight: 700; font-size: 13px; letter-spacing: -0.01em; color: var(--text); }
  .topnav-sep { color: var(--text-dim); font-size: 12px; margin: 0 2px; }
  .topnav a { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 6px; color: var(--text-dim); text-decoration: none; }
  .topnav a:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--text); text-decoration: none; }
  .topnav a.active { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .topnav a.active { color: #10201c; } }
  :root[data-theme="dark"] .topnav a.active { color: #10201c; }
  :root[data-theme="light"] .topnav a.active { color: #fff; }
</style>

<body>
<nav class="topnav"><div class="topnav-inner"><span class="topnav-brand">W3 PR Tracking</span><span class="topnav-sep">/</span><a href="s12.html?v=1791280826">Sprint 12</a><a href="index.html?v=1791280826">Sprint 13</a><a href="s14.html?v=1791280826">Sprint 14</a><a href="s15.html?v=1791280826">Sprint 15+16</a><a href="s17.html?v=1791280826">Sprint 17</a><a href="s18.html?v=1791280826">Sprint 18</a><a href="s19.html?v=1791280826">Sprint 19</a><a href="kanaya.html?v=1791280826" class="active" style="margin-left:10px">⏳ Chờ Kanaya</a></div></nav><script src="search.js?v=1791280826" data-sprints="[{&quot;label&quot;: &quot;Sprint 12&quot;, &quot;href&quot;: &quot;s12.html&quot;, &quot;data&quot;: &quot;data-s12.json&quot;}, {&quot;label&quot;: &quot;Sprint 13&quot;, &quot;href&quot;: &quot;index.html&quot;, &quot;data&quot;: &quot;data.json&quot;}, {&quot;label&quot;: &quot;Sprint 14&quot;, &quot;href&quot;: &quot;s14.html&quot;, &quot;data&quot;: &quot;data-s14.json&quot;, &quot;screens&quot;: &quot;screens-s14.json&quot;}, {&quot;label&quot;: &quot;Sprint 15+16&quot;, &quot;href&quot;: &quot;s15.html&quot;, &quot;data&quot;: &quot;data-s15.json&quot;, &quot;plan&quot;: &quot;s15-plan.json&quot;}, {&quot;label&quot;: &quot;Sprint 17&quot;, &quot;href&quot;: &quot;s17.html&quot;, &quot;data&quot;: &quot;data-s17.json&quot;}, {&quot;label&quot;: &quot;Sprint 18&quot;, &quot;href&quot;: &quot;s18.html&quot;, &quot;data&quot;: &quot;data-s18.json&quot;, &quot;rlabel&quot;: &quot;→r0810/0921&quot;}, {&quot;label&quot;: &quot;Sprint 19&quot;, &quot;href&quot;: &quot;s19.html&quot;, &quot;data&quot;: &quot;data-s19.json&quot;, &quot;rlabel&quot;: &quot;→r0810/0921/1005&quot;}]" defer></script>
<div id="app"></div>
<script src="https://nguyenducbien-art.github.io/pixel-pets/pixel-pets.js" data-min="2" data-max="5" defer></script>
<script>
var WHO='kanayam';
var SPRINTS=[{"label": "Sprint 12", "href": "s12.html", "data": "data-s12.json"}, {"label": "Sprint 13", "href": "index.html", "data": "data.json"}, {"label": "Sprint 14", "href": "s14.html", "data": "data-s14.json"}, {"label": "Sprint 15+16", "href": "s15.html", "data": "data-s15.json"}, {"label": "Sprint 17", "href": "s17.html", "data": "data-s17.json"}, {"label": "Sprint 18", "href": "s18.html", "data": "data-s18.json"}, {"label": "Sprint 19", "href": "s19.html", "data": "data-s19.json"}];
var RAW='https://raw.githubusercontent.com/nguyenducbien-art/w3-pr-tracking-tables/data/';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function tkLink(t){var s=String(t==null?'':t);return /^\d+$/.test(s)
  ?'<a class="ticket" href="https://dialog-inc.backlog.com/view/ANGULAR_REPLACE-'+s+'" target="_blank" rel="noopener" title="Mở ticket '+s+' trên Backlog">'+s+'</a>'
  :'<span class="ticket">'+esc(s)+'</span>';}
var PILL={merged:['merged','MERGED'],draft:['draft','DRAFT'],approved:['approved','APPROVED'],changes:['changes','CHANGES'],open:['open','OPEN']};
function pill(st){var x=PILL[st]||PILL.open;return '<span class="pill pill-'+x[0]+'">'+x[1]+'</span>';}
function has(a){return (a||[]).indexOf(WHO)>=0;}

// Collect every not-merged PR on which WHO is a requested (pending) reviewer.
function collect(S,D){
  var out=[], common={}; (D.common||[]).forEach(function(t){common[t]=1;});
  function take(r,p,target,kind){
    if(!p||p.st==='merged') return;
    var rv=p.rv||r.rvw||{};            // per-PR reviewers when available, else row-level (frozen data)
    if(!has(rv.pd)) return;
    out.push({sprint:S.label,href:S.href,ticket:r.ticket,dev:r.dev,num:p.num,st:p.st,cf:p.cf,cr:p.cr||'',
      nc:p.nc,fc:p.fc,add:p.add,del:p.del,target:target,kind:kind,
      again:has(rv.ch)?'ch':(has(rv.ap)?'ap':''),approx:!p.rv,
      drvurl:r.drvurl,drive:r.drive,unres:r.unres||0,title:r.title||'',url:D.prUrlBase});
  }
  (D.main||[]).forEach(function(r){
    var kind=common[r.ticket]?'common':'màn/fix';
    (r.base||[]).forEach(function(p){take(r,p,'base',kind);});
    ['r629','r713','r727','r810'].forEach(function(k){(r[k]||[]).forEach(function(p){take(r,p,'r',kind);});});
  });
  (D.scaffold||[]).forEach(function(r){take(r,r.pr,'scaffold','scaffold');});
  return out;
}
function row(x){
  var mark=x.cf==='bad'?'<span class="cf-bad" title="CONFLICTING">✗</span>':(x.cf==='unk'?'<span class="cf-unk">?</span>':'<span class="cf-ok" title="MERGEABLE">✓</span>');
  var meta=(x.nc!=null?' <span class="commits">'+x.nc+'c</span>':'')+(x.fc!=null?' <span class="files">'+x.fc+'f</span>':'')
    +((x.add!=null||x.del!=null)?' <span class="adds">+'+(x.add||0)+'</span><span class="dels">−'+(x.del||0)+'</span>':'');
  var wait=x.again==='ch'?'<span class="rv-pd" title="Kanaya đã request changes, đang chờ review lại"><span class="rv-ch" style="margin:0">✗</span>→⏳ review lại</span>'
    :(x.again==='ap'?'<span class="rv-pd" title="Kanaya đã approve, được mời review lại"><span class="rv-ap" style="margin:0">✓</span>→⏳ review lại</span>'
    :'<span class="rv-pd" title="được request, chưa review lần nào">⏳ lần đầu</span>');
  if(x.approx) wait+=' <span class="cf-unk" title="Data sprint đông lạnh: reviewer gộp theo ticket, không chắc đúng PR này">?</span>';
  var rep=x.drvurl?('<a class="report-yes" href="'+esc(x.drvurl)+'" target="_blank" rel="noopener" title="Mở file report">✓ mở</a>')
    :(x.drive?'<span class="report-yes">✓</span>':'<span class="report-no">—</span>');
  var devcls=(x.dev==='bien')?'dev dev-bien':'dev';
  return '<tr data-dev="'+esc(x.dev)+'" data-target="'+x.target+'">'
    +'<td><a href="'+esc(x.url)+x.num+'" target="_blank" rel="noopener">#'+x.num+'</a>'+(x.cr?' <span class="date-cell">('+esc(x.cr)+')</span>':'')+' '+pill(x.st)+' '+mark+meta+'</td>'
    +'<td>'+wait+'</td>'
    +'<td>→'+x.target+'</td>'
    +'<td>'+tkLink(x.ticket)+'</td>'
    +'<td><span class="'+devcls+'">'+esc(x.dev)+'</span></td>'
    +'<td><a href="'+esc(x.href)+'#q='+x.num+'" title="Mở dòng này ở page sprint">'+esc(x.sprint)+'</a></td>'
    +'<td>'+esc(x.kind)+'</td>'
    +'<td>'+rep+'</td>'
    +'<td>'+(x.unres>0?'<span class="unresolved">'+x.unres+'</span>':'0')+'</td>'
    +'<td><span class="title-cell">'+esc(x.title)+'</span></td></tr>';
}
var F={dev:'',target:''};
function render(all,updated,errs){
  var seen={}; all=all.filter(function(x){if(seen[x.num])return false;seen[x.num]=1;return true;});
  all.sort(function(a,b){return a.num-b.num;});   // PR cũ nhất (chờ lâu nhất) lên đầu
  var n1=all.filter(function(x){return !x.again;}).length, bad=all.filter(function(x){return x.cf==='bad';}).length;
  function opts(key,lbl){var v={};all.forEach(function(x){v[x[key]]=(v[x[key]]||0)+1;});
    return lbl+': <select data-f="'+key+'" style="font-size:12px;padding:2px 6px;border-radius:6px;margin-right:14px"><option value="">Tất cả ('+all.length+')</option>'
      +Object.keys(v).sort().map(function(k){return '<option value="'+esc(k)+'"'+(F[key]===k?' selected':'')+'>'+(key==='target'?'→':'')+esc(k)+' ('+v[k]+')</option>';}).join('')+'</select>';}
  var html='<div class="page"><div class="page-header"><h1>⏳ PR đang chờ Kanaya review</h1>'
    +'<span class="meta">cập nhật '+esc(updated)+' · gom từ '+SPRINTS.length+' page sprint</span></div>'
    +'<div class="subtitle">Mọi PR <b>chưa MERGED</b> mà <b>'+WHO+'</b> đang được request review (GitHub “Reviewers” còn chờ) — gồm cả PR Kanaya đã request changes rồi được mời review lại. '
    +'Sắp theo số PR tăng dần (PR cũ nhất ở trên). Dữ liệu lấy từ các page sprint nên tươi theo lịch cron của từng sprint (Sprint 19: 5 phút, sprint cũ: 30 phút).</div>'
    +'<div class="stats">'
      +'<div class="stat">PR đang chờ <span class="stat-val">'+all.length+'</span></div>'
      +'<div class="stat">lần đầu <span class="stat-val">'+n1+'</span></div>'
      +'<div class="stat">review lại <span class="stat-val">'+(all.length-n1)+'</span></div>'
      +'<div class="stat">conflict <span class="stat-val warn">'+bad+'</span></div>'
    +'</div>'
    +(errs.length?'<p style="color:var(--unresolved-fg);font-size:12px">Không tải được: '+esc(errs.join(', '))+'</p>':'')
    +'<div class="devfilter" style="margin:8px 0 2px;font-size:12px;color:var(--text-dim)">'+opts('dev','Lọc dev')+opts('target','Nhánh đích')+'</div>'
    +'<div class="scroll-wrap"><table><thead><tr><th>PR</th><th>Chờ Kanaya</th><th>Nhánh đích</th><th>Ticket</th><th>Dev</th><th>Sprint</th><th>Loại</th><th>Report</th><th>Unres.</th><th>Title</th></tr></thead>'
    +'<tbody id="kb">'+(all.length?all.map(row).join(''):'<tr><td colspan="10" style="text-align:center;padding:24px">Không có PR nào đang chờ Kanaya 🎉</td></tr>')+'</tbody></table></div>'
    +'<div class="footnote">Status pill: <span class="pill pill-open">OPEN</span> <span class="pill pill-draft">DRAFT</span> <span class="pill pill-approved">APPROVED</span> <span class="pill pill-changes">CHANGES</span> · ✓ MERGEABLE / ✗ CONFLICTING.<br>'
    +'<span class="rv-pd">⏳ lần đầu</span> = được request, Kanaya chưa review lần nào · <span class="rv-pd"><span class="rv-ch" style="margin:0">✗</span>→⏳ review lại</span> = Kanaya đã request changes, đã được mời review lại.<br>'
    +'Report / Unres. (Copilot chưa resolve) là số của cả dòng ticket ở page sprint. Bấm tên sprint để mở đúng dòng ở page đó.</div></div>';
  document.getElementById('app').innerHTML=html;
  applyF();
}
function applyF(){
  [].forEach.call(document.querySelectorAll('#kb tr[data-dev]'),function(tr){
    tr.style.display=((!F.dev||tr.getAttribute('data-dev')===F.dev)&&(!F.target||tr.getAttribute('data-target')===F.target))?'':'none';});
}
document.addEventListener('change',function(e){
  var s=e.target; if(!s||!s.getAttribute||!s.getAttribute('data-f'))return;
  F[s.getAttribute('data-f')]=s.value; applyF();
});
function load(){
  var list=SPRINTS.filter(function(s){return s.data;}), errs=[], upd='';
  return Promise.all(list.map(function(S){
    return fetch(RAW+S.data+'?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();})
      .then(function(D){ if((D.updated||'')>upd) upd=D.updated; return collect(S,D); })
      .catch(function(){errs.push(S.label);return [];});
  })).then(function(parts){ render([].concat.apply([],parts),upd,errs); });
}
load(); setInterval(load,60000);
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[href^="http"]');
  if(a){e.preventDefault();window.open(a.href,'_blank','noopener');}
},true);
</script>
